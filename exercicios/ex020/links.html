<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perssonalizando links</title>
    <style>
        /*  
            SELETORES PERSSONALIZADOS
            #   = id
            .   = class
            :   = pseudo-class
            ::  = pseudo-element
            >   = clildren
        */
        body{
            font-family: Arial, Helvetica, sans-serif;
        }

        a{
            color: red;
            text-decoration: none;
            font-weight: bold;
        }

        a:visited{
            color: darkred;
        }

        a:hover{
            color: black;
            text-decoration: underline;
        }

        a:active{
            color: yellow;
        }

        .destaque{
            background-color: rgb(255, 178, 178);
        }

        .destaque::before{
            content: ' [link]';
            text-decoration: none;
            font-weight: normal;
            color: rgb(112, 101, 101);
        }

        .destaque::after{
            content: ' [link]';
            text-decoration: none;
            font-weight: normal;
            color: rgb(112, 101, 101);
        }
    </style>
</head>
<body>
    <h1>Perssonalizando Links</h1>
    <ul>
        <li><a href="https://gustavoguanabara.github.io">Repositorio GitHub</a></li>
        <li><a href="https://youtube.com/cursoemvideo/" class="destaque">Canal do YouTube</a></li>
        <li><a href="https://www.cursoemvideo.com" class="destaque">Site do Cursoemvideo</a></li>
    </ul>
</body>
</html>
