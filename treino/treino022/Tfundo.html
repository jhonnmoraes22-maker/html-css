<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Treinin de imagens de fundo</title>
    <style>
        body{
            background-image: url('imagens/wallpaper001.jpg');
        }
        h1{
            color: #87ceeb;
            text-align: center;
        }
        h1::before{
            content: '\2B07\00a0';
        }
        h1::after{
            content: '\00a0\2B07';
        }


        div.quadrado{
            display: inline-block;
            border: 3px solid black;
            background-color: gray;
            border-radius: 10px;
            width: 300px;
            height: 300px;
        }

        div#q1{
            background-color: #87ceeb;
            border-radius: 10px 0px 0px 10px;
        }
        div#q2{
            background-image: linear-gradient(to bottom, #87ceeb, #4B869D);
            border-radius: 0px;
        }
        div#q3{
            background-image: url("imagens/pattern002.png");
            border-radius: 0px 10px 10px 0px;
        }
    </style>
</head>
<body>
    <h1>Algumas imagens de fundo abaixo</h1>
    <div class="quadrado" id="q1">

    </div>
    <div class="quadrado" id="q2">

    </div>
    <div class="quadrado" id="q3">

    </div >
</body>
</html>
