<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Treino de Alinhamento de vertical</title>
    <style>
        /*  
        background-position: center center;
        background-size: 200px;
        background-repeat: no-repeat;
        background-image: url("https://static.wikia.nocookie.net/cult-of-the-lamb/images/5/56/Lamb.png/revision/latest/smart/width/250/height/250?cb=20220920161036");
        background-color: brown;
        */

        #fora{
            background-image: url('imagens/target001.png');
            background-size: 100% 100%;
            height: 500px;
            background-color: brown;
            padding: 10px;
            border-radius: 10px;

            position: relative;
        }
        #dentro{
            height: 200px;
            width: 400px;
            padding: 5px;
            border-radius: 10px;
            position: absolute;

            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            
            background: gold url('https://static.wikia.nocookie.net/cult-of-the-lamb/images/5/56/Lamb.png/revision/latest/smart/width/250/height/250?cb=20220920161036')center center no-repeat;
            background-size: 200px;
        }
    </style>
</head>
<body>
    <section id="fora">
        <article id="dentro">

        </article>
    </section>
</body>
</html>
