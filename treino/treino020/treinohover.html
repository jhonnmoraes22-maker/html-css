<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>treino de hover</title>
    <style>
        div{
            color: green;
        }
        div > p{
            display: none;
        }
        div:hover > p{
            display: block;
            background-color: aqua;
            color: aliceblue;
        }
    </style>
</head>
<body>
    <h1>CULT OF THE LAMB</h1>
    <p>Passe o mouse sobre o texto para receber a dlc</p>
    <div>
        Passa ai
        <p>Nao tem nada betinha</p>
    </div>
</body>
</html>
